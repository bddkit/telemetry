name = "bddkit-telemetry"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"

routes = [{ pattern = "telemetry.bddkit.dev", custom_domain = true }]

# POSTHOG_TOKEN is a secret: `wrangler secret put POSTHOG_TOKEN`.

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }
